name: Build PhiOS XR native debug APK

on:
  pull_request:
    paths:
      - 'native/quest-godot/**'
      - '.github/workflows/native-debug-apk.yml'
  push:
    branches: [main]
    paths:
      - 'native/quest-godot/**'
      - '.github/workflows/native-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Godot 4.6.2 ARM64 OpenXR Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.6.2
      GODOT_TAG: 4.6.2-stable
      PROJECT_DIR: native/quest-godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner Android SDK required}"
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          sdkmanager --sdk_root="${ANDROID_HOME}" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install pinned Godot editor and matching Android export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_TAG}_linux.x86_64"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o godot-templates.tpz
          mkdir -p "${RUNNER_TEMP}/godot-templates"
          unzip -q godot-templates.tpz -d "${RUNNER_TEMP}/godot-templates"
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "${RUNNER_TEMP}/godot-templates/templates/." "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          test -s "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"
          echo "GODOT_BIN=${GITHUB_WORKSPACE}/Godot_v${GODOT_TAG}_linux.x86_64" >> "${GITHUB_ENV}"

      - name: Configure Android SDK and ephemeral debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/godot" "${RUNNER_TEMP}/phios-signing"
          keytool -genkeypair -keystore "${RUNNER_TEMP}/phios-signing/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=PhiOS XR CI Debug,O=Enter The Field,C=US" -noprompt
          cat > "${HOME}/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${RUNNER_TEMP}/phios-signing/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${RUNNER_TEMP}/phios-signing/debug.keystore" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "${GITHUB_ENV}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "${GITHUB_ENV}"

      - name: Import native project
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --editor --path "${PROJECT_DIR}" --import --quit

      - name: Export signed debug APK using Godot built-in OpenXR loader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "${GODOT_BIN}" --headless --path "${PROJECT_DIR}" \
            --install-android-build-template --export-debug "Quest Debug" \
            "${GITHUB_WORKSPACE}/dist/PhiOS-XR-Quest-debug.apk"
          test -s dist/PhiOS-XR-Quest-debug.apk

      - name: Inspect APK payload without device installation
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq dist/PhiOS-XR-Quest-debug.apk
          zipinfo -1 dist/PhiOS-XR-Quest-debug.apk | grep -q '^lib/arm64-v8a/'
          "${ANDROID_HOME}/build-tools/35.0.1/aapt" dump badging dist/PhiOS-XR-Quest-debug.apk | tee dist/apk-badging.txt
          sha256sum dist/PhiOS-XR-Quest-debug.apk | tee dist/SHA256SUMS.txt
          echo "APK exported. This does NOT verify Quest 3 runtime compatibility."

      - name: Upload short-lived build artifact
        uses: actions/upload-artifact@v4
        with:
          name: phios-xr-quest-debug-${{ github.sha }}
          path: |
            dist/PhiOS-XR-Quest-debug.apk
            dist/SHA256SUMS.txt
            dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 7

# Debug keystore is generated per CI run; APKs from different runs may require
# uninstalling the previous build due to signature mismatch. No release signing
# material or sensitive credentials are stored in this repository.
