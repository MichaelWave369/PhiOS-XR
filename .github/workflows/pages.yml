name: Verify and deploy PhiOS XR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck and Pages build
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      # Upload the Pages artifact once, during verification. Rerunning only
      # the deploy job must not create a duplicate github-pages artifact.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      # Reuse the artifact uploaded by verify: never upload it a second time
      # when GitHub returns a transient Pages 5xx and deploy is retried.
      - id: deployment
        uses: actions/deploy-pages@v4
